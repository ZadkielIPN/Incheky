<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<body>
<header th:fragment="header(active)" class="topbar">
  <div class="container nav">
    <a class="brand" th:href="@{/}">
      <span class="logo">
        <img th:src="@{/img/icono.jpg}" alt="icono">
      </span>
      <span>Incheky</span></a>
    <nav class="links">
      <a th:href="@{/}" th:classappend="${active == 'store'} ? ' active'">Tienda</a>
      <th:block th:if="${
      (session.usuarioLogueado != null and session.usuarioLogueado.rol.name() == 'CAJERO') or
      (session.usuarioLogueado != null and session.usuarioLogueado.rol.name() == 'ADMINISTRADOR')
      }">
        <a th:href="@{/supermercado}" th:classappend="${active == 'supermarket'} ? ' active'">Supermercado</a>
      </th:block>
      <th:block th:if="${session.usuarioLogueado != null and session.usuarioLogueado.rol.name() == 'ADMINISTRADOR'}">
        <a th:href="@{/administradores}" th:classappend="${active == 'admin'} ? ' active'">Dar de alta</a>
        <a th:href="@{/proveedores}" th:classappend="${active == 'suppliers'} ? ' active'">Proveedores</a>
        <a th:href="@{/productos}" th:classappend="${active == 'products'} ? ' active'">Productos</a>
      </th:block>
      <th:block th:if="${session.usuarioLogueado == null}" th:class="registro-inicio">
        <a th:href="@{/login}" th:classappend="${active == 'login'} ? ' active'">Iniciar sesión</a>
        <a th:href="@{/create}" th:classappend="${active == 'register'} ? ' active'">Crear cuenta</a>
      </th:block>

      <th:block th:if="${session.usuarioLogueado != null}">
        <span class="user-greeting" th:text="|Hola, ${session.usuarioLogueado.nombre}|">
          Nombre Usuario
        </span>
        <a th:href="@{/perfil}" class="registro-inicio">
          Mi Perfil
        </a>
        <form class="logout-form" th:action="@{/logout}" method="post">
          <button class="logout-button" type="submit">Cerrar sesión</button>
        </form>
      </th:block>
    </nav>
  </div>
</header>
<footer th:fragment="footer"><div class="container">© 2026 Incheky · Todos los derechos reservados</div></footer>
</body>
</html>
