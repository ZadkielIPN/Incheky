<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Crear cuenta | Incheky</title>
    <link rel="stylesheet" th:href="@{/css/incheky.css}">
    <link rel="icon" type="image/svg+xml" sizes="32x32" th:href="@{/img/favicon.svg}">
</head>
<body>
<header th:replace="~{fragments/layout :: header('register')}"></header>
<main class="container">
    <section class="panel narrow"><h1>Crear cuenta</h1>
        <p class="muted">Únete al programa de lealtad de Incheky.</p>
        <form method="post" th:action="@{/create}" th:object="${clienteDto}">
            <div class="form-grid">
                <div class="field"><label>Nombre</label><input th:field="*{nombre}"></div>
                <div class="field"><label>Apellido</label><input th:field="*{apellido}"></div>
            </div>
            <div class="field">
                <label for="email">Correo</label>
                <input id="email" type="email" th:field="*{email}">
            </div>
            <div class="field">
                <label for="password">Contraseña</label>
                <input id="password" type="password" th:field="*{contrasena}">
            </div>
            <input type="hidden" th:field="*{rol}" value="CLIENTE">
            <input type="hidden" th:field="*{puntos}" value="0">
            <input type="hidden" th:field="*{nivelLealtad}" value="BRONCE">
            <button class="btn" type="submit">Crear cuenta</button>
        </form>
    </section>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
