<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Productos | Incheky</title>
    <link rel="stylesheet" th:href="@{/css/incheky.css}">
    <link rel="icon" type="image/svg+xml" sizes="32x32" th:href="@{/img/favicon.svg}">
</head>
<body>
<header th:replace="~{fragments/layout :: header('productos')}"></header>
<main class="container section">
    <div class="section-head">
        <div>
            <h1>Productos</h1>
            <p class="muted">Registra productos.</p>
        </div>
    </div>
    <div class="notice" th:if="${mensaje}" th:text="${mensaje}"></div>
    <div class="notice error" th:if="${error}" th:text="${error}"></div>
    <div class="form-grid">
        <section class="panel"><h2>Dar de alta</h2>
            <form method="post" th:action="@{/productos}" th:object="${producto}" enctype="multipart/form-data">
                <div class="form-grid">
                    <div class="field">
                        <label for="nombre">Nombre</label>
                        <input id="nombre" th:field="*{nombre}">
                        <small class="notice error" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></small>
                    </div>
                    <div class="field">
                        <label for="descripcion">Descripcion</label>
                        <input id="descripcion" th:field="*{descripcion}">
                        <small class="notice error" th:if="${#fields.hasErrors('descripcion')}" th:errors="*{descripcion}"></small>
                    </div>
                </div>
                <div class="field">
                    <label for="precio">Precio</label>
                    <input id="precio" type="number" th:field="*{precio}">
                    <small class="notice error" th:if="${#fields.hasErrors('precio')}" th:errors="*{precio}"></small>
                </div>
                <div class="field">
                    <label for="peso">Peso</label>
                    <input id="peso" type="number" th:field="*{peso}">
                    <small class="notice error" th:if="${#fields.hasErrors('peso')}" th:errors="*{peso}"></small>
                </div>
                <div class="field">
                    <label for="stock">Stock</label>
                    <input id="stock" type="number" th:field="*{stock}">
                    <small class="notice error" th:if="${#fields.hasErrors('stock')}" th:errors="*{stock}"></small>
                </div>
                <div class="field">
                    <label for="activo">Activo</label>
                    <input id="activo" type="checkbox" th:field="*{activo}">
                    <small class="notice error" th:if="${#fields.hasErrors('activo')}" th:errors="*{activo}"></small>
                </div>
                <div class="field">
                    <label for="barcode">Codigo de Barras</label>
                    <input id="barcode" type="number" th:field="*{codigoBarras}">
                    <small class="notice error" th:if="${#fields.hasErrors('codigoBarras')}" th:errors="*{codigoBarras}"></small>
                </div>
                <label>Unidad de Medida</label>
                <div class="ss-wrap" id="unidadMedidaWrap">
                    <span class="ss-label">Unidad de Medida</span>
                    <div id="unidadMedidaData" style="display:none">
                        <div th:each="unidadMedida : ${unidadesMedida}"
                             th:data-id="${unidadMedida.name()}"
                             th:data-nombre="${unidadMedida.descripcion}">
                        </div>
                    </div>
                    <div class="ss-input-row" id="unidadMedidaInputRow">
                        <input class="ss-bare-input" id="unidadMedidaInput"
                               autocomplete="off" type="text"/>
                        <label for="unidadMedidaInput"></label>
                    </div>
                    <div class="ss-dropdown" id="unidadMedidaDropdown"></div>
                    <div id="unidadMedidaConsultaHiddenFields"></div>
                    <span th:errors="*{unidadMedida}" class="error-msg"></span>
                </div>
                <div class="field">
                    <label for="fechaCaducidad">Fecha de Caducidad</label>
                    <input id="fechaCaducidad" type="date" th:field="*{fechaCaducidad}">
                    <small class="notice error" th:if="${#fields.hasErrors('fechaCaducidad')}" th:errors="*{fechaCaducidad}"></small>
                </div>
                <div class="field">
                    <label for="archivoImagen">Imagen</label>
                    <input id="archivoImagen" name="archivoImagen" type="file" accept="image/*">
                    <small class="notice error" th:if="${#fields.hasErrors('imagen')}" th:errors="*{imagen}"></small>
                </div>
                <input type="hidden" th:field="*{promocionIds}" name="promocionIds">
                <input type="hidden" th:field="*{valoracion}" name="valoracion" value="0">
                <button class="btn" type="submit">Registrar producto</button>
            </form>
        </section>
        <section class="panel"><h2>Directorio</h2>
            <div class="table-wrap">
                <table class="table">
                    <thead>
                    <tr>
                        <th>Nombre</th>
                        <th>Descripcion</th>
                        <th>Precio</th>
                        <th>Stock</th>
                        <th>Activo</th>
                        <th>Codigo de Barras</th>
                        <th>Unidad de Medida</th>
                        <th>Fecha de Caducidad</th>
                        <th>Promociones</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="producto : ${productos}">
                        <td th:text="${producto.nombre}"></td>
                        <td th:text="${producto.descripcion}"></td>
                        <td th:text="${producto.precio}"></td>
                        <td th:text="${producto.stock}"></td>
                        <td th:text="${producto.activo}"></td>
                        <td th:text="${producto.codigoBarras}"></td>
                        <td th:text="${producto.unidadMedida}"></td>
                        <td th:text="${producto.fechaCaducidad}"></td>
                        <td th:text="${producto.promocionIds}"></td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
<script th:src="@{/js/utils/dropdown.js}"></script>
<script>
    initSearchSelect({
        wrapperId: 'unidadMedidaWrap',
        dataId: 'unidadMedidaData',
        inputId: 'unidadMedidaInput',
        inputRowId: 'unidadMedidaInputRow',
        dropdownId: 'unidadMedidaDropdown',
        hiddenFieldsId: 'unidadMedidaConsultaHiddenFields',
        fieldName: 'unidadMedida',
        badgeText: 'Tipo',
        multiple: false,
        variant: 'enum'
    });
</script>
</body>
</html>
