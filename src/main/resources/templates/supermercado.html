<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Supermercado | Incheky</title>
    <link rel="stylesheet" th:href="@{/css/incheky.css}">
    <link rel="icon" type="image/svg+xml" sizes="32x32" th:href="@{/img/favicon.svg}">
</head>
<body>
<header th:replace="~{fragments/layout :: header('supermarket')}"></header>
<main class="container section">
    <div class="section-head">
        <div>
            <h1>Supermercado físico</h1>
            <p class="muted">Consulta el catálogo y disponibilidad actual.</p>
        </div>
        <span class="tag">Sucursal Centro</span>
    </div>
    <div class="grid">
        <article class="card" th:each="producto : ${productos}">
            <div class="card-body">
                <img th:src="@{'/uploads/productos/' + ${producto.imagen}}"
                     th:if="${producto.imagen != null}"
                     th:alt="${producto.nombre}">
                <span class="tag" th:text="${producto.unidadMedida}"></span>
                <h3 th:text="${producto.nombre}"></h3>
                <p class="muted" th:text="${producto.descripcion}"></p>
                <div class="section-head">
                    <span class="price" th:text="'$' + ${#numbers.formatDecimal(producto.precio,1,2)}"></span>
                    <span class="muted" th:text="${producto.stock} + ' disponibles'"></span>
                </div>
                <button class="btn" type="button">Agregar al ticket</button>
            </div>
        </article>
    </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
