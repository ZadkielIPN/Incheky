
spring:
  application:
    name: Incheky

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
    encoding:
      charset: UTF-8
      enabled: true
      force: true

  datasource:
    url: jdbc:mysql://${DB_HOST}:3306/${DB_NAME}?sslMode=REQUIRED&serverTimezone=America/Mexico_City
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  sql:
    init:
      mode: never

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false

  web:
    locale: es_MX
    locale-resolver: fixed

  mail:
    host: smtp.gmail.com
    port: 587
    username: incheky@gmail.com
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

app:
  cors:
    allowed-origins: "${CORS_ALLOWED_ORIGINS:http://localhost:4200}"
  upload:
    dir: ${UPLOAD_DIR:uploads}

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        same-site: lax
        secure: false

management:
  health:
    mail:
      enabled: false

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
